<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>aoaoaoa soundboard</title>
<style>
  :root {
    --bg: #0e0e10;
    --fg: #f4f4f5;
    --accent: #ff5e5b;
    --button: #1f1f23;
    --button-hover: #2c2c33;
    --border: #2a2a30;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--fg);
    min-height: 100vh;
    padding: 2rem 1rem;
  }
  header {
    text-align: center;
    margin-bottom: 2rem;
  }
  h1 {
    margin: 0 0 0.5rem;
    font-size: 2rem;
    letter-spacing: -0.02em;
  }
  .submissions {
    display: inline-block;
    margin-top: 0.5rem;
    color: var(--accent);
    text-decoration: none;
    border: 1px solid var(--accent);
    padding: 0.4rem 0.9rem;
    border-radius: 999px;
    font-size: 0.9rem;
  }
  .submissions:hover { background: var(--accent); color: var(--bg); }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 0.75rem;
    max-width: 1100px;
    margin: 0 auto;
  }
  button.sound {
    background: var(--button);
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.1rem 1rem;
    font-size: 1rem;
    cursor: pointer;
    transition: background 0.15s, transform 0.05s;
    text-align: center;
    line-height: 1.3;
  }
  button.sound:hover { background: var(--button-hover); }
  button.sound:active { transform: scale(0.98); }
  button.sound.playing {
    border-color: var(--accent);
    background: var(--button-hover);
  }
  footer {
    text-align: center;
    margin-top: 3rem;
    color: #777;
    font-size: 0.85rem;
  }
</style>
</head>
<body>
<header>
  <h1>aoaoaoa soundboard</h1>
</header>

<main class="grid" id="board"></main>

<footer>
  <a class="submissions" href="mailto:submit@aoaoaoasoundboard.com">submissions</a>
</footer>

<script>
  const sounds = [
    "aoaoaoa",
    "i need to calm down",
    "sorry kids we dont go to church",
    "thats the rule thats the goal now",
    "they took the l and gave it to the gbtq",
    "what are we doing whats going on",
    "im falling",
    "im missing",
    "pinwheel",
    "straight to padlet",
    "come on flalalady",
    "dizzle dutz",
    "hi dizzle dutz",
    "well hi dizzle dutz",
    "dizzle dutz ipad",
    "moose master",
    "sleep in labubu key change",
    "youre miscorrecting me",
    "stop it actually pisses me off",
    "so just write it",
    "ho bags with wings",
    "turn it off",
    "fix you",
    "rock reveals jade", // #209 - Vertical Micro-Drama Writer’s Room - 58:21 - https://www.youtube.com/watch?v=U-eRshQEDyA
  ];

  const board = document.getElementById("board");
  let current = null;

  sounds.forEach(file => {
    const audio = new Audio(encodeURIComponent(file + ".mp3"));
    audio.preload = "none";

    const btn = document.createElement("button");
    btn.className = "sound";
    btn.textContent = file;
    btn.addEventListener("click", () => {
      if (current && current.audio !== audio) {
        current.audio.pause();
        current.audio.currentTime = 0;
        current.btn.classList.remove("playing");
      }
      if (!audio.paused) {
        audio.pause();
        audio.currentTime = 0;
        btn.classList.remove("playing");
        current = null;
      } else {
        audio.play();
        btn.classList.add("playing");
        current = { audio, btn };
      }
    });
    audio.addEventListener("ended", () => {
      btn.classList.remove("playing");
      if (current && current.audio === audio) current = null;
    });

    board.appendChild(btn);
  });
</script>
</body>
</html>
