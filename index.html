<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/webp" href="logo.webp">
<title>aoaoaoa soundboard</title>
<style>
  :root {
    --bg: #0e0e10;
    --fg: #f4f4f5;
    --accent: #ff5e5b;
    --button: #1f1f23;
    --button-hover: #2c2c33;
    --border: #2a2a30;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--fg);
    min-height: 100vh;
    padding: 2rem 1rem;
  }
  header {
    text-align: center;
    margin-bottom: 2rem;
  }
  h1 {
    margin: 0 0 0.5rem;
    font-size: 2rem;
    letter-spacing: -0.02em;
  }
  .submissions {
    display: inline-block;
    margin-top: 0.5rem;
    color: var(--accent);
    text-decoration: none;
    border: 1px solid var(--accent);
    padding: 0.4rem 0.9rem;
    border-radius: 999px;
    font-size: 0.9rem;
  }
  .submissions:hover { background: var(--accent); color: var(--bg); }
  .filter {
    max-width: 1100px;
    margin: 0 auto 1rem;
    display: block;
  }
  .filter input {
    width: 100%;
    background: var(--button);
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 0.75rem 1rem;
    font-size: 1rem;
    outline: none;
    transition: border-color 0.15s;
  }
  .filter input:focus { border-color: var(--accent); }
  .filter input::placeholder { color: #777; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 0.75rem;
    max-width: 1100px;
    margin: 0 auto;
  }
  button.sound.hidden { display: none; }
  button.sound {
    background: var(--button);
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.1rem 1rem;
    font-size: 1rem;
    cursor: pointer;
    transition: background 0.15s, transform 0.05s;
    text-align: center;
    line-height: 1.3;
  }
  button.sound:hover { background: var(--button-hover); }
  button.sound:active { transform: scale(0.98); }
  button.sound.playing {
    border-color: var(--accent);
    background: var(--button-hover);
  }
  footer {
    text-align: center;
    margin-top: 3rem;
    color: #777;
    font-size: 0.85rem;
  }
</style>
</head>
<body>
<header>
  <h1>aoaoaoa soundboard</h1>
</header>

<div class="filter">
  <input id="filter" type="search" placeholder="filter sounds..." autocomplete="off">
</div>

<main class="grid" id="board"></main>

<footer>
  <a class="submissions" href="https://forms.gle/4KtG1GAvCupCYK1f7">submissions</a>
</footer>

    "the puppet said that",                    // #135 - Vegas Performers                              -   16:52 - https://www.youtube.com/watch?v=pIm2E0OfrlE
  ];

  const board = document.getElementById("board");
  const filter = document.getElementById("filter");
  const buttons = [];
  let current = null;

  sounds.forEach(file => {
    const audio = new Audio(encodeURIComponent(file + ".mp3"));
    audio.preload = "none";

    const btn = document.createElement("button");
    btn.className = "sound";
    btn.textContent = file;
    buttons.push(btn);
    btn.addEventListener("click", () => {
      if (current && current.audio !== audio) {
        current.audio.pause();
        current.audio.currentTime = 0;
        current.btn.classList.remove("playing");
      }
      if (!audio.paused) {
        audio.pause();
        audio.currentTime = 0;
        btn.classList.remove("playing");
        current = null;
      } else {
        audio.play();
        btn.classList.add("playing");
        current = { audio, btn };
      }
    });
    audio.addEventListener("ended", () => {
      btn.classList.remove("playing");
      if (current && current.audio === audio) current = null;
    });

    board.appendChild(btn);
  });

  filter.addEventListener("input", () => {
    const q = filter.value.trim().toLowerCase();
    buttons.forEach(btn => {
      btn.classList.toggle("hidden", q && !btn.textContent.toLowerCase().includes(q));
    });
  });
</script>
